<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A3A">
<meta property="og:title" content="TripFit">
<meta property="og:description" content="둘이 한 말로, 둘 다 OK인 일정">
<meta property="og:image" content="og.png">
<title>TripFit</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== tokens (from the bento references: flat colour, no blur, no gradient) ===== */
:root {
  --navy: #0E2A3A; --navy-2: #173A4C; --cream: #F3F1EA;
  --lime: #D6F23B; --mint: #BDEFDB; --pink: #FFCCE5; --sky: #8EC5EE; --peach: #F8D5BC; --butter: #F4E58E; --leaf: #A8E2C3;
  --violet: #7B5CFF; --red: #FF5B4A; --lilac: #CBBDFF;
  --stage: #E7F1EC;
  --kr: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  --gr: "Inter Tight", "Helvetica Neue", Helvetica, Arial, "Pretendard Variable", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --spring-ms: 700ms;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--stage); font-family: var(--kr); color: var(--navy); -webkit-font-smoothing: antialiased; overflow: hidden; word-break: keep-all; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.gr { font-family: var(--gr); font-feature-settings: "tnum", "ss01"; font-variant-numeric: tabular-nums; }

/* ===== stage ===== */
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.rig { display: flex; align-items: center; gap: 44px; transform-origin: center center; }
.cap { width: 330px; display: flex; flex-direction: column; gap: 24px; }
.cap-n { font: 500 15px var(--gr); letter-spacing: .02em; opacity: .5; }
.cap-n b { opacity: 1; font-weight: 600; }
.cap-t { font: 500 52px/1.08 var(--kr); letter-spacing: -.055em; min-height: 2.2em; }
.cap-t .tl-line { display: block; } .cap-t .w { display: inline-block; white-space: nowrap; } .cap-t .c { display: inline-block; }
.cap-s { font: 400 17px/1.6 var(--kr); color: #3E5563; min-height: 5em; }
.cap-prog { display: flex; gap: 4px; }
.cap-prog i { height: 6px; width: 18px; border-radius: 6px; background: rgba(14, 42, 58, .15); transition: width .5s var(--spring), background .3s; }
.cap-prog i.on { width: 48px; background: var(--navy); }
.cap-prog i.done { background: rgba(14, 42, 58, .45); }

.device { position: relative; width: 417px; height: 876px; border-radius: 68px; padding: 12px; background: #0A0D10; flex: none;
  box-shadow: 0 0 0 1.5px #4D5560, 0 0 0 3.5px #9AA2AC, 0 0 0 5px #39404A, 0 50px 90px -40px rgba(14, 42, 58, .5); }
.screen { position: relative; width: 393px; height: 852px; border-radius: 56px; overflow: hidden; background: var(--navy); isolation: isolate; }
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 48px; z-index: 40; font: 600 16.5px var(--gr); color: var(--navy); pointer-events: none; transition: color .3s; }
.sb.lt, .screen.scrolled .sb { color: var(--cream); }
.sb::before { content: ""; position: absolute; inset: 0; background: var(--navy); opacity: 0; transition: opacity .2s; z-index: -1; }
.screen.scrolled .sb::before { opacity: 1; }
.sb svg { display: block; }
.sb .r { display: flex; gap: 6px; align-items: center; }
#view { position: absolute; inset: 0; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--cream); transform: translateX(-50%); z-index: 45; pointer-events: none; }

/* dynamic island */
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 19px; background: #000; z-index: 50; overflow: hidden; color: #fff; }
.is-c { position: absolute; inset: 0; display: flex; align-items: center; gap: 12px; padding: 0 18px 0 14px; opacity: 0; transition: opacity .15s; white-space: nowrap; }
.island.open .is-c { opacity: 1; transition: opacity .25s .12s; }
.is-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--t, var(--lime)); color: var(--navy); display: grid; place-items: center; flex: none; }
.is-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.is-tx b { font: 600 15px var(--kr); letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; }
.is-tx small { font: 400 12.5px var(--kr); color: rgba(255, 255, 255, .6); overflow: hidden; text-overflow: ellipsis; }
.is-r { font: 500 15px var(--gr); color: var(--lime); flex: none; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(14, 42, 58, .25); border-top-color: var(--navy); animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

.dev-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 4px; background: rgba(14, 42, 58, .2); transition: width .5s var(--spring), background .3s; cursor: pointer; }
.dots i.on { width: 26px; background: var(--navy); }

/* engine: a second "device" made of the same blocks */
.engine { width: 336px; height: 852px; border-radius: 48px; background: var(--navy); padding: 6px; display: flex; flex-direction: column; gap: 4px; flex: none; color: var(--navy); }
.eg-hero { background: var(--lime); border-radius: 42px 42px 30px 30px; padding: 24px 22px 20px; }
.eg-hero .row { display: flex; justify-content: space-between; align-items: center; }
.eg-big { font: 500 76px/.9 var(--gr); letter-spacing: -.05em; margin-top: 18px; display: flex; align-items: baseline; gap: 4px; }
.eg-big em { font: 500 20px var(--gr); font-style: normal; letter-spacing: 0; }
.eg-cap { font-size: 13.5px; font-weight: 500; margin-top: 10px; min-height: 2.6em; line-height: 1.35; }
.eg-log { flex: 1; background: var(--navy-2); border-radius: 30px; padding: 18px 18px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; color: var(--cream); }
.eg-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; font-size: 12.5px; line-height: 1.4; color: rgba(243, 241, 234, .55); }
.eg-row.new { color: var(--cream); }
.eg-src { font: 600 10px/1.9 var(--gr); letter-spacing: .08em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.eg-ms { font: 500 12.5px var(--gr); color: var(--lime); white-space: nowrap; }
.eg-rule { background: var(--pink); border-radius: 30px; padding: 18px 20px; font: 500 17px/1.35 var(--kr); letter-spacing: -.03em; }
.eg-keys { color: rgba(243, 241, 234, .5); font-size: 11px; line-height: 1.9; padding: 6px 14px 8px; }
.eg-keys kbd { font: 600 10px var(--gr); border: 1px solid rgba(243, 241, 234, .3); color: var(--cream); border-radius: 5px; padding: 0 5px; }

/* ===== bento primitives ===== */
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 4px 150px; scrollbar-width: none; background: var(--navy); }
.scr::-webkit-scrollbar { display: none; }
.b { position: relative; border-radius: 30px; padding: 18px 20px; margin-bottom: 4px; color: var(--navy); background: var(--bg, var(--cream)); }
.top { border-radius: 52px 52px 30px 30px; padding-top: 62px; }
.lilac { --bg: var(--lilac); } .lime { --bg: var(--lime); } .mint { --bg: var(--mint); } .pink { --bg: var(--pink); } .sky { --bg: var(--sky); } .cream { --bg: var(--cream); } .peach { --bg: var(--peach); }
/* interlocking tab/notch (reference 1): .cut paints a navy slot, the next block's .tab rises into it */
.cut::after { content: ""; position: absolute; bottom: 0; left: 50%; width: 104px; height: 14px; margin-left: -52px; background: var(--navy); border-radius: 10px 10px 0 0; }
.cut.cr::after { left: auto; right: 40px; margin: 0; }
.cut.cl::after { left: 40px; margin: 0; }
.tab::before { content: ""; position: absolute; top: -14px; left: 50%; width: 96px; height: 18px; margin-left: -48px; background: var(--bg, var(--cream)); border-radius: 10px 10px 0 0; }
.tab.tr::before { left: auto; right: 44px; margin: 0; }
.tab.tl::before { left: 44px; margin: 0; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.lab { font: 500 12.5px var(--kr); opacity: .8; }
.cap-up { font: 600 11px var(--gr); letter-spacing: .09em; text-transform: uppercase; opacity: .75; }
.h { font: 600 25px/1.24 var(--kr); letter-spacing: -.045em; margin-top: 10px; min-height: 2.48em; }
.h .tl-line { display: block; } .h .w { display: inline-block; white-space: nowrap; } .h .c { display: inline-block; }
.ico { width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: var(--lime); display: grid; place-items: center; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 15px; border-radius: 99px; border: 1.5px solid var(--navy); font: 600 13px var(--kr); white-space: nowrap; }
.pill.fill { background: var(--navy); color: var(--cream); }
.pill.on-dark { border-color: rgba(243, 241, 234, .35); color: var(--cream); }
.flag { position: relative; z-index: 3; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 99px; background: var(--navy); color: var(--cream); font: 600 13.5px var(--kr); margin: -20px 0 -20px 12px; box-shadow: 0 0 0 4px var(--navy); }
.av { width: var(--s, 36px); height: var(--s, 36px); border-radius: 50%; background: var(--c); color: var(--navy); display: grid; place-items: center; font: 600 calc(var(--s, 36px) * .4) var(--kr); flex: none; box-shadow: 0 0 0 2px var(--navy); }
.av.n { background: var(--navy); color: var(--c); box-shadow: none; }
.av-stack { display: flex; } .av-stack .av + .av { margin-left: -10px; }

.cta-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 10px 28px; background: linear-gradient(to top, var(--navy) 60%, rgba(14, 42, 58, 0)); z-index: 20; }
.btn { width: 100%; height: 64px; border-radius: 99px; background: var(--lime); color: var(--navy); font: 600 17px var(--kr); letter-spacing: -.03em; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 28px; transition: transform .2s var(--ease), opacity .3s; }
.btn .go { width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: var(--lime); display: grid; place-items: center; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .25; cursor: default; }
.btn.navy { background: var(--navy); color: var(--cream); }
.btn.navy .go { background: var(--lime); color: var(--navy); }

/* odometer */
.odo { display: inline-flex; }
.od-c { display: inline-block; height: 1em; overflow: hidden; }
.od-s { display: flex; flex-direction: column; transition: transform var(--spring-ms) var(--spring); }
.od-s span { height: 1em; line-height: 1em; display: block; text-align: center; }
.od-x { display: inline-block; line-height: 1em; }

/* chat */
.msg { display: flex; gap: 12px; align-items: flex-start; }
.msg.me { flex-direction: row-reverse; text-align: right; }
.msg .tx { font: 500 19px/1.42 var(--kr); letter-spacing: -.035em; flex: 1; }
.msg .who { font: 600 11px var(--gr); letter-spacing: .09em; text-transform: uppercase; opacity: .55; margin-bottom: 4px; }
.typing { display: flex; gap: 5px; padding: 12px 0; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--navy); opacity: .3; animation: typ 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.msg.me .typing { justify-content: flex-end; }
@keyframes typ { 30% { opacity: 1; transform: translateY(-3px); } }
.date-c { width: 54px; height: 54px; border-radius: 50%; background: var(--navy); color: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.date-c b { font: 500 20px/1 var(--gr); } .date-c small { font: 600 9px var(--gr); letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-top: 2px; }

/* understand */
.quote { font: 500 20px/1.5 var(--kr); letter-spacing: -.035em; margin: 12px 0 14px; }
.ph { padding: 0 3px; margin: 0 -3px; border-radius: 7px; background: linear-gradient(var(--navy), var(--navy)) no-repeat 0 70% / 0% 86%; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-size .45s var(--ease), color .3s; }
.ph.on { color: var(--bg); background-size: 100% 86%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip.hide { visibility: hidden; }
.fly { position: absolute; z-index: 30; pointer-events: none; }
.src-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 6px 10px; }
.fn-n { font: 500 76px/.9 var(--gr); letter-spacing: -.055em; margin-top: 22px; height: 72px; display: flex; align-items: baseline; gap: 8px; transform-origin: left center; }
.fn-n em { font: 500 20px var(--kr); font-style: normal; letter-spacing: -.03em; }

/* plans: timer-style numbers + dot slider */
.big2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; margin-top: 18px; }
.bn { font: 500 92px/.86 var(--gr); letter-spacing: -.06em; display: flex; align-items: baseline; }
.bn em { font: 500 22px var(--gr); font-style: normal; letter-spacing: 0; margin-left: 3px; }
.bn.r { justify-content: flex-end; }
.colon { font: 500 64px/.86 var(--gr); padding: 0 4px 6px; }
.bn-lab { display: flex; justify-content: space-between; margin-top: 12px; font: 600 12.5px var(--kr); }
.bn-lab span { display: flex; align-items: center; gap: 6px; }
.bn-lab i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--navy); }
.sc-track { position: relative; height: 46px; margin: 18px 10px 0; touch-action: none; cursor: grab; }
.sc-rail { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--navy); transform: translateY(-50%); }
.sc-det { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--navy); transform: translate(-50%, -50%); }
.sc-thumb { position: absolute; top: 50%; width: 42px; height: 42px; border-radius: 50%; background: var(--navy); color: var(--lime); transform: translate(-50%, -50%); display: grid; place-items: center; }
.sc-thumb.snap { transition: left .55s var(--spring); }
.sc-lab { display: flex; justify-content: space-between; font: 600 11px var(--gr); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; opacity: .75; }
.mapblk { padding: 0; }
.mapblk > div:first-child { border-radius: 30px; overflow: hidden; }
.map { display: block; width: 100%; height: auto; }
.map-ov { position: absolute; left: 14px; top: 14px; }
.map-ov .pill { background: var(--mint); height: 30px; font-size: 12.5px; }
.mk-pin { transform-box: fill-box; transform-origin: center; }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 20px 20px 22px; }
.stats .v { font: 500 34px/1 var(--gr); letter-spacing: -.045em; margin-top: 8px; display: flex; align-items: baseline; gap: 2px; }
.stats .v em { font: 500 14px var(--gr); font-style: normal; letter-spacing: 0; }

/* timeline: each stop is a block */
.tl { position: relative; }
.ti { position: relative; }
.stop { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px 18px 16px 16px; }
.stop .nm { font: 600 17px/1.25 var(--kr); letter-spacing: -.04em; }
.stop .mt { font: 500 12.5px var(--kr); opacity: .8; margin-top: 3px; }
.stop .tm { text-align: right; }
.stop .tm b { display: block; font: 500 30px/1 var(--gr); letter-spacing: -.05em; }
.stop .tm small { display: block; font: 500 12px var(--gr); opacity: .55; margin-top: 4px; }
.stop .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.stop .tags:empty { display: none; }
.stop .pill { height: 26px; padding: 0 10px; font-size: 11.5px; }
.stop .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--navy); }
.stop.lock { --bg: var(--violet); color: var(--cream); background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .13) 0 8px, transparent 8px 16px); }
.stop.lock .ico { background: var(--cream); color: var(--violet); }
.stop.lock .pill { border-color: var(--cream); }
.stop.lock .mt { opacity: 1; }
.stop.crowd { --bg: var(--red); color: var(--navy); }
.stop.crowd .ico { background: var(--navy); color: var(--red); }
.stop.out .nm { text-decoration: line-through; text-decoration-thickness: 2.5px; }
.endrow { display: flex; gap: 6px; padding: 10px 2px 6px; }
.endrow .pill { border-color: rgba(243, 241, 234, .35); color: var(--cream); }
.endrow .pill .gr { color: var(--lime); }

/* 한 말 체크리스트 (사람별 만족도의 근거) */
.cl .b { padding: 16px 16px 14px; }
.cl .head { display: flex; justify-content: space-between; align-items: baseline; }
.cl .head b { font: 500 26px/1 var(--gr); letter-spacing: -.04em; }
.ci { display: grid; grid-template-columns: 1fr 44px 34px; gap: 6px; align-items: center; margin-top: 9px; font: 600 12.5px var(--kr); }
.ci { cursor: pointer; }
.ci.muted .ci-label { text-decoration: line-through; }
.ci.muted > i { opacity: .25; }
.ci .pill { height: 17px; padding: 0 4px; font-size: 9px; margin-left: 3px; }
.ci .pill[hidden] { display: none; }
.ci i { display: block; height: 8px; border-radius: 6px; background: rgba(14, 42, 58, .15); overflow: hidden; }
.ci i b { display: block; height: 100%; background: var(--navy); border-radius: 6px; transition: width var(--spring-ms) var(--spring); }
.ci em { font: 500 12.5px var(--gr); font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }

/* 숨은 한 곳 +1 (서울미래유산) */
.hid { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.hid .t { flex: 1; }
.hid .t b { display: block; font: 600 18px/1.2 var(--kr); letter-spacing: -.04em; }
.hid .t small { display: block; font: 500 12.5px var(--kr); opacity: .65; margin-top: 4px; }
.sw { width: 58px; height: 34px; border-radius: 99px; border: 1.5px solid var(--navy); position: relative; flex: none; transition: background .3s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: var(--navy); transition: transform .5s var(--spring), background .3s; }
.hid.on .sw { background: var(--navy); }
.hid.on .sw::after { transform: translateX(24px); background: var(--lilac); }
.sc-track.off { opacity: .3; pointer-events: none; }
.stop .pill.story { cursor: pointer; background: var(--navy); color: var(--lilac); border-color: var(--navy); }
.story-name { font: 500 34px/1.1 var(--kr); letter-spacing: -.055em; margin-top: 16px; }
.story-tx { font: 500 19px/1.55 var(--kr); letter-spacing: -.035em; }
.credit { font-size: 11.5px; line-height: 1.5; color: rgba(243, 241, 234, .6); padding: 12px 16px 14px; }

/* what-if */
.deltas { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; }
.deltas .v { font: 500 38px/1 var(--gr); letter-spacing: -.05em; display: flex; align-items: baseline; gap: 2px; }
.deltas .v em { font: 500 14px var(--gr); font-style: normal; letter-spacing: 0; }
.deltas .lab { margin-top: 6px; display: flex; align-items: center; gap: 5px; }
.deltas .lab i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--navy); }
.tray .row2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tray .pill { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: .75; }
.note { font-size: 12.5px; color: rgba(243, 241, 234, .55); padding: 6px 12px 0; line-height: 1.5; }

/* sheet = a stack of blocks */
.dim { position: absolute; inset: 0; background: rgba(5, 14, 20, .6); z-index: 30; }
.sheet { max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; position: absolute; left: 6px; right: 6px; bottom: 6px; background: var(--navy); border-radius: 50px; padding: 4px; z-index: 31; }
.sheet > .b:first-child { border-radius: 46px 46px 30px 30px; }
.sheet > .b:last-child { margin-bottom: 0; border-radius: 30px 30px 46px 46px; }
.grab { position: absolute; top: 10px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: currentColor; opacity: .3; }
.prod { --bg: var(--violet); color: var(--cream); padding-top: 30px; min-height: 186px; overflow: hidden; }
.prod .pr { flex-wrap: wrap; font: 500 64px/.9 var(--gr); letter-spacing: -.055em; margin-top: 30px; display: flex; align-items: baseline; gap: 4px; }
.prod .pr small { font: 500 14px var(--kr); letter-spacing: 0; }

  return { x: (r.left - s.left) / S, y: (r.top - s.top) / S, w: r.width / S, h: r.height / S };
}
function openSheet(v, html) {
  const dim = document.createElement("div"), sh = document.createElement("div");
  dim.className = "dim"; sh.className = "sheet";
  sh.innerHTML = html;
  v.append(dim, sh);
  sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
  sh.setAttribute("aria-label", $("[data-sheet-title]", sh)?.textContent || "상세 정보");
  fitNumbers();
  E(dim, [{ opacity: 0 }, { opacity: 1 }], 300);
  A(sh, [{ transform: "translateY(105%)" }, { transform: "none" }], "soft");
  [...sh.children].forEach((b, i) => A(b, [{ transform: `translateY(${40 + i * 30}px)` }, { transform: "none" }], "soft", { delay: 40 + i * 50 }));
  let closed = false;
  const close = async () => {
    if (closed) return; closed = true;
    result.onClose?.();
    if (v._sheet && v._sheet.el === sh) v._sheet = null;
    dim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 260, fill: "forwards" });
    await sh.animate([{ transform: "none" }, { transform: "translateY(110%)" }], { duration: reduce ? 1 : 340, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" }).finished;
    dim.remove(); sh.remove();
  };
  dim.addEventListener("click", close);
  sh.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Escape") close();
  });
  // Drag from the handle/header, or pull down when the scroll is at the top.
  let pull = null;
  sh.addEventListener("touchstart", e => {
    if (sh.scrollTop <= 0 && !e.target.closest("button,a,input,textarea,label,iframe")) pull = { x: e.touches[0].clientX, y: e.touches[0].clientY, dy: 0 };
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (!pull) return;
    const dy = e.touches[0].clientY - pull.y;
    if (dy > 0 && dy > Math.abs(e.touches[0].clientX - pull.x) && e.cancelable) {
      e.preventDefault(); pull.dy = dy; sh.style.transform = `translateY(${dy}px)`;
    }
  }, { passive: false });
  sh.addEventListener("touchend", () => {
    if (!pull) return;
    if (pull.dy > 75) close();
    else if (pull.dy) A(sh, [{ transform: `translateY(${pull.dy}px)` }, { transform: "none" }], "soft");
    sh.style.transform = ""; pull = null;
  });
  const result = { el: sh, close };
  v._sheet = result;
  return result;
}

let sessionHistory = [];
try {
  const saved = JSON.parse(localStorage.getItem(ledgerKey) || "[]");
  if (Array.isArray(saved)) sessionHistory = saved.filter(r => r && typeof r.id === "string" && P.some(p => p.name === r.person) && typeof r.label === "string");
} catch (_) { /* in-memory fallback */ }
const allHistory = () => [...(D.history || []).map(r => ({...r, sample:true})), ...sessionHistory];
const concessionCounts = () => Object.fromEntries(P.map(p => [p.name, allHistory().filter(r => r.person === p.name).length]));
const nextPerson = () => {

  return [...P].sort((a,b) => counts[a.name] - counts[b.name] || (a.name === last?.person ? 1 : b.name === last?.person ? -1 : 0))[0].name;
};

}

function recommendedFor(W) {
  const counts = concessionCounts();
  const options = [...W.relaxations].sort((a,b) => b.preview.minSat - a.preview.minSat || (counts[a.owner] || 0) - (counts[b.owner] || 0) || (a.id === W.recommended?.id ? -1 : 1));

  const pair = P.map(p => Math.round(best.preview.sat[p.name])).join(" : ");
  const reasons = [`양보 후 ${pair}으로 더 고르게 · 낮은 쪽 ${best.preview.minSat.toFixed(1)}%`, last ? `${due !== best.owner ? "참고 · " : ""}${last.date === "이번" ? "앞서 성수에선" : `지난번 ${last.place}에선`} ${last.person}이 양보했어요 · 이번엔 ${due} 차례` : "양보 장부에 첫 기록을 남겨요"];
  return {id:best.id, options, reasons};
}

function markup(text, marks) {
  const phrases = [...new Set(marks.map(m => m.phrase).filter(Boolean))].sort((a,b)=>b.length-a.length);
  let html="", offset=0; const done=[];
  while(offset<text.length){
    const phrase=phrases.find(ph=>text.startsWith(ph,offset));
    if(phrase){html+=`<span class="ph" data-ph="${escapeHTML(phrase)}">${escapeHTML(phrase)}</span>`;done.push(phrase);offset+=phrase.length;}
    else html+=escapeHTML(text[offset++]);
  }
  return {html, spanFor:ph=>done.find(w=>w.includes(ph))};
}

function planDiff(a, b) {
  const sa = new Set(a.stops.map(s => s.id)), sb = new Set(b.stops.map(s => s.id));
  return { added: b.stops.filter(s => !sa.has(s.id)), dropped: a.stops.filter(s => !sb.has(s.id)), walk: b.walkM - a.walkM, j: b.sat[P[0].name] - a.sat[P[0].name], s: b.sat[P[1].name] - a.sat[P[1].name] };
}
function planTitle(p) {
  if (p.id === "h") return `미래유산 한 곳 더,\n둘 다 ${Math.floor(Math.min(p.sat[P[0].name], p.sat[P[1].name]))}% 넘게`;
  const j = Math.round(p.sat[P[0].name]), s = Math.round(p.sat[P[1].name]);
  if (Math.abs(j - s) <= 8) return `둘 다 ${Math.floor(Math.min(p.sat[P[0].name], p.sat[P[1].name]))}% 넘게\n만족하는 일정`;
  return j > s ? `지민을 위해\n서연이 양보한 일정` : `서연을 위해\n지민이 양보한 일정`;
}

  track.addEventListener("pointerdown", e => { if (busy || hiddenOn) return; drag = true; track.setPointerCapture(e.pointerId); thumb.classList.remove("snap"); const f = at(e); thumb.style.left = f * 100 + "%"; apply(Math.round(f * (n - 1))); });
  track.addEventListener("pointermove", e => { if (!drag) return; const f = at(e); thumb.style.left = f * 100 + "%"; apply(Math.round(f * (n - 1))); });
  const up = () => { if (!drag) return; drag = false; scaleTo(idx); };
  track.addEventListener("pointerup", up); track.addEventListener("pointercancel", up); track.addEventListener("lostpointercapture", up);
  v._scaleTo = scaleTo;
  v._scaleBy = d => scaleTo(Math.min(n - 1, Math.max(0, idx + d)));

  // 숨은 한 곳 +1: heritage spots join the candidates and at least one must be visited
  const H = D.hidden, hidBlk = $("#hid", v);
  let hiddenOn = false;
  hidBlk.hidden = !H.plan;
  const setHidden = on => {
    if (!H.plan) return;
    if (busy || on === hiddenOn) return;
    hiddenOn = on;
    hidBlk.classList.toggle("on", on);
    hidBlk.setAttribute("aria-checked", String(on));
    A(hidBlk, [{ transform: "scale(.97)" }, { transform: "none" }], "pop");
    const prev = plan;
    if (on) {
      idx = D.defaultIdx;
      thumb.classList.add("snap"); thumb.style.left = (n === 1 ? 50 : idx / (n - 1) * 100) + "%";
      plan = H.plan;
      log("heritage", `서울미래유산 CSV · 성수 후보 ${H.candidates.length}곳 (공공누리 1유형)`);
      log("mip", `tag_min(heritage ≥ 1) · 균형 목적 그대로`, H.plan.solveMs);
    } else plan = D.series[idx];
    track.classList.toggle("off", on);
    paint(plan);
    const d = planDiff(prev, plan);
    island.show({ icon: "heritage", tone: "var(--lilac)", title: on ? "미래유산 후보를 더해 다시 계산" : "원래 후보로 돌아가요", sub: `${diffLine(d)} · ${P[0].name} ${signed(d.j)} · ${P[1].name} ${signed(d.s)}`, right: on ? `${H.plan.solveMs}ms` : "", hold: 2800 });
  };
  async function toggleMuted(person, label) {
    if (busy) return;
    if (hiddenOn) setHidden(false);
    if (!LIVE) {
      island.show({ title: "서버 연결 시 동작해요" });
      return;
    }
    const nextMuted = muted.filter(it => it.person !== person || it.label !== label);
    const conceding = nextMuted.length === muted.length;
    if (conceding) nextMuted.push({ person, label });
    busy = true;
    drag = false;
    track.classList.add("off");
    island.show({ spin: true, title: "양보를 반영해 다시 계산 중", hold: 0 });
    try {
      const result = await api("/api/plan", { muted: nextMuted, tag_min: {} });
      if (!result.series?.length) throw new Error("빈 일정");
      if (!alive(t)) return;
      // Commit together, so failed requests preserve the previous checklist.
      muted.splice(0, muted.length, ...nextMuted);
      recordConcession(`pref:${person}:${label}`, conceding ? {person, label, note: "이 말은 양보할게"} : null);
      D.series = result.series;
      D.defaultIdx = result.defaultIdx;
      n = D.series.length;
      idx = D.defaultIdx;
      plan = D.series[idx];
      $$(".sc-det", track).forEach(dot => dot.remove());
      thumb.insertAdjacentHTML("beforebegin", D.series.map((_, i) => `<span class="sc-det" style="left:${n === 1 ? 50 : i / (n - 1) * 100}%"></span>`).join(""));
      thumb.classList.add("snap");
      thumb.style.left = (n === 1 ? 50 : idx / (n - 1) * 100) + "%";
      paint(plan);
      const message = `${person}의 '${label}' ${conceding ? "양보" : "양보 취소"} → 지민 ${plan.sat["지민"]} · 서연 ${plan.sat["서연"]}`;
      island.show({ title: message, right: `${result.solveMs}ms`, hold: 3500 });
      log("mip", message, result.solveMs);
    } catch (_) {
      if (alive(t)) island.show({ title: "다시 계산하지 못했어요", sub: "한 번 더 눌러주세요" });
    } finally {
      busy = false;
      track.classList.remove("off");
    }
  }
  P.forEach((person, i) => {
    const box = $(`#cli${i}`, v);
    const toggle = e => {
      const row = e.target.closest(".ci");
      if (row) toggleMuted(person.name, row.dataset.label);
    };
    box.addEventListener("click", toggle);
    box.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); toggle(e); }
    });
  });
  hidBlk.addEventListener("click", () => setHidden(!hiddenOn));
  hidBlk.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); setHidden(!hiddenOn); }
  });

  v._hidden = setHidden;
  v._toggleHidden = () => setHidden(!hiddenOn);
  v._story = () => {const stop=H.plan?.stops.find(s=>placeById[s.id]?.hidden);if(stop)openStory(v,stop.id);};
  cta(v, "체험 하나 넣어보기", () => go(3));
}

/* checklist rows: label · bar · % (bars and numbers animate in place) */
function renderChecklist(box, total, items, sat, formula, person) {
  if (box.children.length !== items.length || [...box.children].some((row,i)=>row.dataset.label !== items[i].label)) box.innerHTML = items.map(it => `<div class="ci" role="button" tabindex="0" data-label="${escapeHTML(it.label)}" aria-label="${escapeHTML(it.label)} 이 말은 양보할게"><span><span class="ci-label">${escapeHTML(it.label)}</span><small class="pill intensity"></small><small class="pill conceded" hidden>양보</small></span><i><b style="width:0"></b></i><em></em></div>`).join("");
  [...box.children].forEach((row, k) => {
    const it = items[k], f = it.fulfilled, conceded = !!it.muted || it.weight === 0;
    row.classList.toggle("muted", conceded);
    row.setAttribute("aria-pressed", String(conceded));
    $(".conceded", row).hidden = !conceded;
    const intensity = $(".intensity", row);
    intensity.textContent = it.weight === 1 ? "꼭" : it.weight === .7 ? "보통" : it.weight === .4 ? "살짝" : "제외";
    intensity.title = `강도 ${it.weight.toFixed(1)}`;
    $("i b", row).style.width = f * 100 + "%";
    $("em", row).textContent = Math.round(f * 100) + "%";
  });
  const active = items.filter(it => it.weight > 0), w = active.reduce((a, it) => a + it.weight, 0);
  const calculated = Math.round(1000 * active.reduce((a, it) => a + it.weight * it.fulfilled, 0) / (w || 1)) / 10;
  const matches = calculated.toFixed(1) === sat.toFixed(1);
  if (!matches) console.warn("만족도 식과 sat 불일치", { person, calculated, sat });
  total.textContent = Math.round(sat) + "%";
  formula.dataset.calculated = calculated.toFixed(1); formula.dataset.sat = sat.toFixed(1);
  const numerator = active.map(it => `${+(it.fulfilled * 100).toFixed(2)}×${it.weight.toFixed(1)}`).join(" + ");
  const denominator = active.map(it => it.weight.toFixed(1)).join("+");
  formula.innerHTML = `<span class="lab">충족률 × 강도, 모두 더해 나누기</span><div class="equation gr">${w ? `(${numerator}) ÷ (${denominator})` : "활성 항목 없음"} = <b>${sat.toFixed(1)}%</b></div><small>꼭 1.0 · 보통 0.7 · 살짝 0.4${matches ? "" : " · 서버 계산값 표시"}</small>`;
}

      <div><div class="v gr">${signed(d.s)}<em>%p</em></div><div class="lab" style="--c:${P[1].color}"><i></i>${P[1].name}</div></div></div>`);
    top.classList.add("cut");
    $$(".deltas > div", top).forEach((x, i) => A(x, [{ opacity: 0, transform: "translateY(20px) scale(.7)" }, { opacity: 1, transform: "none" }], "pop", { delay: 600 + i * 90 }));
    const tray = $("#tray", v);
    tray.innerHTML = `<div class="b peach tab tray"><div class="row between"><span class="lab" style="opacity:.75;font-weight:600">빠지는 곳</span><span class="gr" style="font:500 28px var(--gr)">${d.dropped.length}</span></div><div class="row2">${d.dropped.map(s => `<span class="pill">${escapeHTML(short(s.name))}</span>`).join("")}</div></div>`;
    rise(tray.firstChild, 900);
    $$(".tray .pill", tray).forEach((x, i) => A(x, [{ opacity: 0, transform: "translateX(-30px) rotate(-6deg)" }, { opacity: 1, transform: "none" }], "pop", { delay: 1100 + i * 90 }));
    if (placeById[W.pick].availability === "unverified") $("#note", v).textContent = `${at} 자리와 가격은 확인이 필요해요. 상품 페이지에서 확인해 주세요.`;
    log("llm", `diff → 문장화 (숫자는 솔버 값 그대로)`);
    next.disabled = false;
  }
  addBtn.addEventListener("click", run);
  v._run = async () => {
    const preferred = choices.findIndex(w => placeById[w.pick].fixedStart === 15 * 60);
    $$(".slot", sh.el)[Math.max(0, preferred)].click();
    await sleep(700); await run();
    if (chooseRelaxation && alive(t)) {
      await sleep(1000);
      await chooseRelaxation(recommendationId);
    }
  };
}

/* Payment input and the visible summary are both made from this agreement. */

  sh.el.classList.add("pay-sheet");
  sh.el.setAttribute("aria-label","예약하고 결제하기");
  $("#closePay",sh.el).onclick=sh.close;
  if(!booked)return;
  const controller=new AbortController();sh.onClose=()=>controller.abort();
  try{
    const [{fromTripFit},response]=await Promise.all([import(new URL("pay/engine/tripfit.js",location.href).href),fetch("pay/index.html",{signal:controller.signal})]);
    if(!response.ok)throw new Error("결제 화면 불러오기 실패");

      ...d.added.map(s => `<span class="pill" style="background:var(--lime)">+ ${escapeHTML(short(s.name))}</span>`),

    $$(".pill", chg).forEach((x, i) => A(x, [{ opacity: 0, transform: "translateX(-30px) scale(.7)" }, { opacity: 1, transform: "none" }], "pop", { delay: 300 + i * 100 }));
    btn.setLabel("처음부터 다시 보기");
    btn.disabled = false;
    btn.onclick = () => { resetConcessions(); go(0); };
  }

}

  });
  const v = document.createElement("div");
  v.style.cssText = "position:absolute;inset:0;";

  cv()._scaleTo(0); await sleep(2600); if (!ok()) return;
  cv()._scaleTo(D.defaultIdx); await sleep(2200); if (!ok()) return;
  cv()._hidden(true); await sleep(2800); if (!ok()) return;
  cv()._story(); await sleep(3400); if (!ok()) return;
  cv()._sheet?.close(); await sleep(900); if (!ok()) return;
  cv()._hidden(false); await sleep(1600); if (!ok()) return;
  go(3); await sleep(1600); if (!ok()) return;
  await cv()._ready; if (!ok()) return;
  await cv()._run(); await sleep(3800); if (!ok()) return;
  go(4); await sleep(1000); if (!ok()) return;
  await cv()._ready; if (!ok()) return;
  await cv()._run(); await sleep(2600); if (!ok()) return;
  go(5); await sleep(3000); if (!ok()) return;
  await cv()._ready; if (!ok()) return;
  await cv()._run();
  } finally { if (id === autoId) autoPlaying = false; }
}

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input,textarea,select,[contenteditable]")) return;
  const k = e.key, v = view.lastElementChild;
  if (k !== "a" && k !== "A") { autoId++; autoPlaying = false; }
  if (k === "ArrowRight" || k === " ") { e.preventDefault(); if (v?._sheet) v._sheet.close(); else go(cur + 1); }
  else if (k === "ArrowLeft") go(cur - 1);
  else if (/^[1-6]$/.test(k)) go(+k - 1);
  else if (k === "a" || k === "A") autoplay();
  else if (k === "c" || k === "C") showConflict();
  else if ((k === "h" || k === "H") && v?._toggleHidden) v._toggleHidden();
  else if (k === "," && v?._scaleBy) v._scaleBy(-1);
  else if (k === "." && v?._scaleBy) v._scaleBy(1);
  else if (k === "e" || k === "E") { document.body.classList.toggle("no-eng"); fit(); }
  else if (k === "r" || k === "R") { $$("#egLog .eg-row").forEach(r => r.remove()); log("mip", modeText); returnToSample(); }
});

/* ---------- mobile engine sheet (reuse the live engine, including its logs) ---------- */
const mobileQuery = matchMedia("(max-width: 700px), (pointer: coarse) and (max-width: 900px)");
const engine = $("#engine");
const engineToggle = document.createElement("button");
engineToggle.className = "engine-toggle";
engineToggle.textContent = "엔진";
engineToggle.setAttribute("aria-controls", "engine");
engineToggle.setAttribute("aria-expanded", "false");
engineToggle.hidden = true;
const engineDim = document.createElement("div");
engineDim.className = "engine-dim";
engineDim.hidden = true;
const engineClose = document.createElement("button");
engineClose.className = "engine-close";
engineClose.textContent = "닫기 ×";
engineClose.hidden = true;
engine.prepend(engineClose);
document.body.append(engineToggle, engineDim);
function toggleEngine(open) {
  document.body.classList.toggle("engine-open", open);
  engineDim.hidden = !open;
  engineToggle.setAttribute("aria-expanded", String(open));
  view.inert = open;
  if (open) {
    engine.setAttribute("role", "dialog");
    engine.setAttribute("aria-modal", "true");
    engine.setAttribute("aria-label", "TripFit 계산 엔진");
    A(engine, [{ transform: "translateY(105%)" }, { transform: "none" }], "soft");
    engineClose.focus();
  } else {
    engine.removeAttribute("role");
    engine.removeAttribute("aria-modal");
    engine.removeAttribute("aria-label");
    if (document.body.classList.contains("mobile")) engineToggle.focus();
  }
}
engineToggle.onclick = () => toggleEngine(true);
engineClose.onclick = engineDim.onclick = () => toggleEngine(false);
engine.addEventListener("keydown", e => {
  if (!document.body.classList.contains("engine-open")) return;
  e.stopPropagation();
  if (e.key === "Escape") { e.stopPropagation(); toggleEngine(false); }
  if (e.key === "Tab") { e.preventDefault(); engineClose.focus(); }
});
mobileQuery.addEventListener("change", fit);

/* ---------- fit to window ---------- */
function fit() {
  const vw = innerWidth, vh = innerHeight, mobile = mobileQuery.matches;
  document.body.classList.toggle("mobile", mobile);
  engineToggle.hidden = engineClose.hidden = !mobile;
  if (mobile) { S = 1; return; }
  if (document.body.classList.contains("engine-open")) toggleEngine(false);
  const eng = vw >= 1100 && !document.body.classList.contains("no-eng"), cap = vw >= 1340;
  $("#engine").style.display = eng ? "" : "none";
  $("#cap").style.display = cap ? "" : "none";
  const w = 417 + (eng ? 44 + 336 : 0) + (cap ? 44 + 330 : 0), h = 876 + 40;
  S = Math.min(1, (vh - 32) / h, (vw - 48) / w);
  $("#rig").style.transform = `scale(${S})`;
}
addEventListener("resize", fit);
fit();
log("mip", modeText);
go(0);
})();
